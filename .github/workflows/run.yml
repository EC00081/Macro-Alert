name: Macro Plumbing Pipeline

on:
  schedule:
    # 8:15 AM ET Mon-Fri (13:15 UTC) -> SOFR
    - cron: '15 13 * * 1-5'
    # 1:30 PM ET Mon-Fri (18:30 UTC) -> ON RRP
    - cron: '30 18 * * 1-5'
    # 4:45 PM ET Thursdays (20:45 UTC) -> Weekly Fed H.4.1 Balance Sheet Release
    - cron: '45 20 * * 4'
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Tracker
        env:
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python tracker.py

      - name: Commit Updated Ledger
        run: |
          git config --global user.name "MacroBot"
          git config --global user.email "bot@github.com"
          git add ledger.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update ledger [skip ci]" && git push)
